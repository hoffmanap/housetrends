name: RentCast Sales & New Construction Pipeline

on:
  schedule:
    # Sales: quarterly, 1st of Jan/Apr/Jul/Oct at 09:00 UTC. Disclosed
    # sale prices are sparse in TX (non-disclosure state), so this trades
    # cadence for a full trailing-year window instead of pulling more
    # often against the same thin trickle of data.
    - cron: "0 9 1 1,4,7,10 *"
    # New construction: 1st of every month at 09:15 UTC
    - cron: "15 9 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a specific pull manually (sales or construction)"
        required: true
        default: "sales"
        type: choice
        options:
          - sales
          - construction
      window_days:
        description: "Override the rolling lookback window in days (leave blank to use the script default)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  determine-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.set-mode.outputs.mode }}
    steps:
      - id: set-mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 9 1 * *" ]; then
            echo "mode=construction" >> "$GITHUB_OUTPUT"
          else
            echo "mode=sales" >> "$GITHUB_OUTPUT"
          fi

  run-pipeline:
    needs: determine-mode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build window-days flag
        id: window-flag
        run: |
          mode="${{ needs.determine-mode.outputs.mode }}"
          window="${{ github.event.inputs.window_days }}"
          if [ -n "$window" ]; then
            if [ "$mode" = "sales" ]; then
              echo "flag=--sales-window-days $window" >> "$GITHUB_OUTPUT"
            else
              echo "flag=--construction-window-days $window" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline (${{ needs.determine-mode.outputs.mode }})
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: python fetch_sales_and_construction.py --mode ${{ needs.determine-mode.outputs.mode }} ${{ steps.window-flag.outputs.flag }}

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ${{ needs.determine-mode.outputs.mode }} data ($(date -u +%Y-%m-%d))"
            git push
          fi
